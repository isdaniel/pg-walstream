name: Fuzz

on:
  pull_request:
    branches: [ "*" ]
    # Only what the std-only fuzz build compiles (backend modules are cfg-gated out).
    paths:
      - 'src/**'
      - '!src/connection/**'
      - '!src/snapshot/**'
      - '!src/copy_text.rs'
      - '!src/retry.rs'
      - '!src/router.rs'
      - '!src/stream.rs'
      - 'Cargo.toml'
      - 'fuzz/**'
      - 'examples/arbitrary-fuzzing/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [roundtrip_bytes, roundtrip_message, roundtrip_stream]
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        # Pinned around the 2026-07-24 codegen ICE (rustc da86f4d07) that panics in rustc_codegen_ssa (operand.rs:291 "not immediate") while compiling tokio under -Zsanitizer=address. nightly-2026-07-23 ships the last-good compiler (rustc 6f72b5dd5, 2026-07-22). Un-pin once fixed upstream.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-23

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Restore corpus cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          if [ -d fuzz/seeds/${{ matrix.target }} ]; then
            cp fuzz/seeds/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/
          fi

      - name: Select fuzz budget
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FUZZ_BUDGET=200" >> "$GITHUB_ENV"
          else
            echo "FUZZ_BUDGET=1200" >> "$GITHUB_ENV"
          fi

      - name: Run fuzz target
        run: |
          set -o pipefail
          cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- \
            -max_total_time=$FUZZ_BUDGET -timeout=10 \
            2>&1 | tee fuzz-${{ matrix.target }}.log

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ matrix.target }}
          path: |
            fuzz-${{ matrix.target }}.log
            fuzz/artifacts/**
          if-no-files-found: ignore
