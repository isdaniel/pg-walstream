name: Benchmarks

on:
  push:
    branches: [main]       
  pull_request:            
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # OIDC: tokenless CodSpeed auth for public repo

jobs:
  benchmarks:
    name: CodSpeed
    # CodSpeed's CLI rejects Ubuntu 26.04 ("Unsupported system"), which ubuntu-latest
    # becomes by 2026-11-19. Move back to ubuntu-latest once it supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain + cargo-codspeed
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build benchmarks
        run: cargo codspeed build --no-default-features --features std

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
