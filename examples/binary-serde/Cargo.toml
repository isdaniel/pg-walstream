[package]
name = "binary-serde"
version = "0.1.0"
edition = "2021"
publish = false
description = "Demonstrates shipping ChangeEvents between processes in postcard, bincode, CBOR, MessagePack and JSON (no database required)"

[dependencies]
# No connection backend is needed: `ChangeEvent` and its serde impls live in the parser-only build.
pg_walstream = { path = "../..", default-features = false, features = ["std"] }
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# `2.0.1` is the last bincode that compiles; 3.0.0 is a `compile_error!` tombstone. The caret keeps cargo on 2.x.
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
ciborium = "0.2.2"
rmp-serde = "1.3.1"
