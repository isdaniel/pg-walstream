[package]
name = "initial-snapshot"
version = "0.1.0"
edition = "2021"
publish = false
description = "Managed initial snapshot: copy existing rows, then stream changes with no gap and no duplicate"

[dependencies]
pg_walstream = { path = "../..", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
